# Build, test and smoke-test the app on every push to main and every pull
# request: the macOS app on macOS, and the shared core (plus the Linux front
# end, once there is one) on x86_64 and arm64 Linux. The zipped app and the
# Linux binaries are kept as workflow artifacts for a couple of weeks.
name: CI

on:
  push:
    # linux: the branch the Linux front end is developed on, until it merges.
    branches: [main, linux]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # macos-26 is GitHub's newest Apple Silicon (arm64) image.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      APP: build/Browser Picker.app
      BIN: build/Browser Picker.app/Contents/MacOS/BrowserPicker
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swiftc --version

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Check the bundle
        run: |
          archs=$(lipo -archs "$BIN")
          echo "architectures: $archs"
          [ "$archs" = arm64 ] || { echo "::error::expected an arm64 binary, got: $archs"; exit 1; }
          plutil -lint Resources/Info.plist "$APP/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"

      - name: No network code
        # SECURITY.md ("What CI checks") says what this proves and what not.
        # In short: it catches networking that the app's own code links or
        # names (URLSession, Network.framework, sockets, DNS, a hard-coded
        # endpoint, an unexpected helper tool). It cannot see inside the
        # system frameworks the app uses, nor inside the tools it runs, and a
        # determined author could get past it; it is a tripwire for honest
        # mistakes and a quick check for readers, not a proof.
        run: |
          fail=0
          err() { echo "::error::$*"; fail=1; }
          flat() { echo "$1" | tr "\n" " "; }

          # 1. Libraries the binary links directly. AppKit and Foundation
          #    load CFNetwork themselves, so it is only the direct list that
          #    can be checked.
          linked=$(otool -L "$BIN" | awk '/^[[:space:]]/ {print $1}' | sort -u)
          echo "Linked:"; echo "$linked" | awk '{print "  " $0}'
          bad=$(echo "$linked" | grep -E '/(Network|CFNetwork|NetworkExtension|WebKit|CloudKit|MultipeerConnectivity|SystemConfiguration)\.framework/|/lib(curl|network)[.]' || true)
          [ -z "$bad" ] || err "links a networking library: $(flat "$bad")"

          # 2. Symbols the binary imports: URL loading, Bonjour, streams to
          #    hosts, Network.framework (nw_*), BSD sockets and DNS, and the
          #    dynamic lookups (dlopen, NSClassFromString, ...) that would let
          #    code reach any of those without importing them by name.
          #    Swift's bridged URLSession API shows up as NSURLSession inside
          #    mangled names, hence the unanchored first line.
          syms=$(nm -u -j "$BIN" | sort -u)
          bad=$(echo "$syms" | grep -E \
            -e 'NSURLSession|NSURLConnection|NSURLDownload|NSURLRequest|NSURLCache|NSHTTPCookie|NSNetService|WKWebView' \
            -e '^_OBJC_CLASS_[$]_(NSHost|NSStream|NSInputStream|NSOutputStream|NSSocketPort|WebView)$' \
            -e '^_nw_|^_sec_protocol_|^_SCNetwork|^_DNSService' \
            -e '^_CF(Socket|Stream|HTTP|Host|NetService|FTP|Network)' \
            -e '^_(socket|connect|bind|listen|accept|sendto|sendmsg|recvfrom|recvmsg)$' \
            -e '^_(getaddrinfo|getnameinfo|gethostbyname2?|gethostbyaddr|res_9_query|res_query)$' \
            -e '^_(dlopen|dlsym|NSClassFromString|objc_getClass|objc_lookUpClass)$' \
            || true)
          [ -z "$bad" ] || err "imports network or dynamic-lookup symbols: $(flat "$bad")"

          # 3. The sources. Short Swift strings live in the code, not in the
          #    binary's string table, so these are read from Sources/.
          #    Helper tools: only these two. open(1) hands the link to a
          #    browser through LaunchServices; osascript posts notifications.
          #    (The macOS app's sources; the Linux job lists its own.)
          tools=$(grep -rhoE '"/(usr/)?s?bin/[^"]*"' Sources/Core Sources/macOS | tr -d '"' | sort -u)
          echo "Tools the sources name:"; echo "$tools" | awk '{print "  " $0}'
          bad=$(echo "$tools" | grep -vxE '/usr/bin/open|/usr/bin/osascript' || true)
          [ -z "$bad" ] || err "names an unexpected tool (update SECURITY.md if it is meant): $(flat "$bad")"
          #    AppleScript that runs a shell or fetches a URL.
          bad=$(grep -rnE 'do shell script|open location|URL access' Sources || true)
          [ -z "$bad" ] || err "AppleScript runs a shell or opens a URL: $bad"
          #    A URL literal is how an endpoint would get in (every source
          #    file, the Linux front end's too). Allowed: a bare
          #    scheme ("https://"), and hosts under the reserved names of
          #    RFC 2606 (example.com/org/net, .example, .test, .invalid,
          #    .localhost), which nothing can be fetched from. The host is
          #    what follows the last @, as in "https://a.example@b.example/".
          bad=$(grep -rnoE '"[A-Za-z][A-Za-z0-9+.-]*://[^"]*"' Sources \
            | grep -vE '://(([A-Za-z0-9.@-]*[.@])?(example\.(com|org|net)|example|test|invalid|localhost))?(:[0-9]*)?([/?#][^"]*)?"$' \
            || true)
          [ -z "$bad" ] || err "has a URL literal outside the reserved example domains: $bad"

          [ "$fail" = 0 ] && echo "no network code found"
          exit "$fail"

      - name: CLI smoke test
        run: |
          # Point the app at an empty config dir, not anything on the runner,
          # and let --init-config fill it from the copy shipped in the bundle.
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg"
          "$BIN" --init-config
          cmp config.example.toml "$XDG_CONFIG_HOME/browser-picker/config.toml"
          echo "# edited" >> "$XDG_CONFIG_HOME/browser-picker/config.toml"
          "$BIN" --init-config
          grep -q '^# edited$' "$XDG_CONFIG_HOME/browser-picker/config.toml" ||
            { echo "::error::--init-config overwrote an existing config"; exit 1; }
          "$BIN" --help

          want="browser-picker $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          got=$("$BIN" --version)
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::--version printed '$got', expected '$want'"; exit 1; }

          "$BIN" --list
          "$BIN" --check https://github.com/matijazezelj/browser-picker

      - name: Package
        run: |
          zip="$RUNNER_TEMP/Browser-Picker-${GITHUB_SHA::7}.zip"
          ditto -c -k --keepParent "$APP" "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZIP }}
          # Already a zip: upload it as is rather than zipped a second time.
          archive: false
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    # The official Swift image (Docker Hub library/swift, maintained by the
    # Swift project), pinned by the digest of its multi-arch index, so both
    # runners get the same toolchain and a re-pushed tag cannot change what
    # builds the release. Chosen over a setup action: no third-party action
    # code runs with the job's token, the toolchain matches the macOS one
    # (6.4.2), and the digest can be checked with
    #   docker buildx imagetools inspect swift:6.4.2-noble
    # Bump tag and digest together; Dependabot does not update job images.
    container:
      image: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
    env:
      BIN: build/browser-picker
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          # The image has no make; it is the only package added.
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends make >/dev/null
          swiftc --version
          make --version | head -1
          [ "$(uname -m)" = "${{ matrix.arch }}" ] ||
            { echo "::error::expected ${{ matrix.arch }}, running on $(uname -m)"; exit 1; }

      - name: Core compiles on its own
        # Sources/Core must need nothing but Foundation.
        run: swiftc -typecheck Sources/Core/*.swift

      - name: Shared tests
        # Foundation on Linux parses URLs with its own code (not
        # CFURL/NSURL as on macOS); a difference shows up here as a failed
        # check, and is fixed in the core rather than skipped.
        run: make test-core

      - name: Build the Linux front end
        id: linux
        run: |
          if [ ! -f Makefile.linux ]; then
            echo "no Makefile.linux yet: only the shared core is checked"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          make build
          make test
          file "$BIN" 2>/dev/null || true
          ls -l "$BIN"

      - name: Linked libraries
        if: steps.linux.outputs.present == 'true'
        # -static-stdlib: the Swift runtime and Foundation are inside the
        # binary, so it runs on a Linux without Swift. Only the C library
        # and its friends may be loaded at run time.
        run: |
          needed=$(readelf -d "$BIN" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort -u)
          echo "NEEDED:"; echo "$needed" | awk '{print "  " $0}'
          bad=$(echo "$needed" | grep -vE '^(libc|libm|libdl|libpthread|librt|libutil|libgcc_s|libstdc\+\+|ld-linux[^ ]*)\.so' || true)
          [ -z "$bad" ] || { echo "::error::links a library that is not part of the C runtime: $(echo $bad)"; exit 1; }

      - name: No network code
        if: steps.linux.outputs.present == 'true'
        # The Linux counterpart of the macOS check (SECURITY.md, "What CI
        # checks"). The binary carries a statically linked Foundation, whose
        # own code (Host, FileManager over NFS, ...) may name resolver
        # functions, so symbols cannot prove much here. What is checked:
        # nothing loads a networking library (above, and FoundationNetworking
        # or libcurl below), no Linux source imports or names a networking
        # API, and the dynamic symbols are listed for a reader.
        run: |
          fail=0
          err() { echo "::error::$*"; fail=1; }
          if strings -a "$BIN" | grep -qE 'libcurl\.so|libFoundationNetworking'; then
            err "the binary refers to libcurl or FoundationNetworking"
          fi
          bad=$(grep -rnE 'import (FoundationNetworking|Network)\b|URLSession|URLRequest|\b(socket|connect|getaddrinfo|gethostbyname|sendto|recvfrom)\(' Sources/Core Sources/Linux || true)
          [ -z "$bad" ] || err "the core or Linux sources use networking: $bad"
          echo "Network-related dynamic symbols (from the C library, for reference):"
          nm -D --undefined-only "$BIN" | awk '{print $NF}' \
            | grep -E '^(socket|connect|bind|listen|accept|send|recv|getaddrinfo|gethostby|getnameinfo|res_)' \
            | sed 's/^/  /' || echo "  (none)"
          [ "$fail" = 0 ] && echo "no network code found"
          exit "$fail"

      - name: CLI smoke test
        if: steps.linux.outputs.present == 'true'
        run: |
          # Empty XDG dirs: no desktop files, no config from the runner.
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg/config" XDG_DATA_HOME="$RUNNER_TEMP/xdg/data" \
                 XDG_DATA_DIRS="$RUNNER_TEMP/xdg/sys" XDG_STATE_HOME="$RUNNER_TEMP/xdg/state"
          mkdir -p "$XDG_DATA_DIRS"
          "$BIN" --init-config
          cmp config.example.toml "$XDG_CONFIG_HOME/browser-picker/config.toml"
          echo "# edited" >> "$XDG_CONFIG_HOME/browser-picker/config.toml"
          "$BIN" --init-config
          grep -q '^# edited$' "$XDG_CONFIG_HOME/browser-picker/config.toml" ||
            { echo "::error::--init-config overwrote an existing config"; exit 1; }
          "$BIN" --help

          version=$(sed -n '/<key>CFBundleShortVersionString<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' Resources/Info.plist)
          want="browser-picker $version"
          got=$("$BIN" --version)
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::--version printed '$got', expected '$want'"; exit 1; }

          "$BIN" --list
          "$BIN" --check https://github.com/matijazezelj/browser-picker
          # Not a link: rejected (status 3), and the text is not echoed.
          set +e
          out=$("$BIN" --check --switch 2>&1); status=$?
          set -e
          echo "$out"
          [ "$status" = 3 ] || { echo "::error::--check --switch: status $status, expected 3"; exit 1; }
          # --open with something that is not a link opens nothing and fails.
          if "$BIN" --open "--renderer-cmd-prefix=/tmp/x"; then
            echo "::error::--open accepted a switch as a link"; exit 1
          fi

      - name: Upload the binary
        if: steps.linux.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-picker-linux-${{ matrix.arch }}
          path: build/browser-picker
          if-no-files-found: error
          retention-days: 14
